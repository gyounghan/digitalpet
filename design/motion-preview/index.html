<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>거북이 동작 미리보기</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2b24;
      --soft-ink: #53645a;
      --muted: #78877e;
      --line: #d7e4da;
      --paper: #ffffff;
      --page: #eef8f1;
      --green: #43a957;
      --green-dark: #287b3c;
      --green-soft: #dff3e3;
      --gold: #f8c44f;
      --coral: #ff766c;
      --shadow: rgba(42, 79, 51, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 28px 22px 40px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 900;
    }

    h1 {
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.12;
      font-weight: 950;
    }

    .source-badge {
      padding: 8px 11px;
      border: 1px solid #d7b144;
      border-radius: 8px;
      background: #fff3bd;
      color: #735605;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .character-switch {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
    }

    .character-button {
      min-height: 62px;
      padding: 9px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--soft-ink);
      text-align: left;
      cursor: pointer;
    }

    .character-button strong,
    .character-button span {
      display: block;
    }

    .character-button strong {
      margin-bottom: 3px;
      font-size: 14px;
      font-weight: 950;
    }

    .character-button span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .character-button[aria-pressed="true"] {
      border-color: var(--green-dark);
      background: var(--green-dark);
      color: #ffffff;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
    }

    .character-button[aria-pressed="true"] span {
      color: #d7f5df;
    }

    .preview-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(300px, 0.82fr);
      gap: 14px;
      align-items: stretch;
    }

    .stage-card,
    .control-card,
    .frames-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 14px 34px var(--shadow);
    }

    .stage {
      position: relative;
      min-height: 510px;
      display: grid;
      place-items: center;
      padding: 72px 24px 64px;
      background: #f8fcf9;
      overflow: hidden;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 34%;
      background: #dcefcf;
      border-top: 1px solid #cce3be;
    }

    .stage::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 74px;
      width: 230px;
      height: 22px;
      border-radius: 50%;
      background: rgba(42, 64, 47, 0.16);
      transform: translateX(-50%);
      filter: blur(3px);
    }

    .stage.dark {
      background: #07110f;
    }

    .stage.dark::before {
      background: #0c251d;
      border-top-color: #235541;
    }

    .stage.dark::after {
      background: rgba(84, 201, 124, 0.18);
    }

    .stage.dark .motion-label {
      border-color: #2b5d4b;
      background: rgba(7, 20, 16, 0.92);
      color: #c9f5d3;
    }

    .motion-label {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .motion-label::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 0 4px #ffe8e5;
    }

    .sprite-canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: min(360px, 76vw);
      height: min(360px, 76vw);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .stage-footer {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      border-top: 1px solid var(--line);
      background: var(--line);
    }

    .metric {
      min-height: 72px;
      padding: 13px 15px;
      background: var(--paper);
    }

    .metric span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      font-size: 16px;
      font-weight: 950;
    }

    .control-card {
      padding: 16px;
    }

    .control-card h2,
    .frames-card h2 {
      font-size: 15px;
      font-weight: 950;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 13px;
    }

    .mode-button {
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fbf9;
      color: var(--soft-ink);
      font-weight: 900;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    .mode-button:hover {
      transform: translateY(-1px);
      border-color: #a8cbb0;
    }

    .mode-button[aria-pressed="true"] {
      border-color: var(--green-dark);
      background: var(--green);
      color: #ffffff;
      box-shadow: inset 0 -3px 0 rgba(26, 96, 46, 0.26);
    }

    .settings {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
    }

    .setting-row {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdfb;
    }

    .setting-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--soft-ink);
      font-size: 12px;
      font-weight: 900;
    }

    .setting-head output {
      color: var(--green-dark);
    }

    input[type="range"] {
      width: 100%;
      margin: 12px 0 0;
      accent-color: var(--green);
    }

    .transport {
      display: grid;
      grid-template-columns: 1fr 48px;
      gap: 8px;
      margin-top: 10px;
    }

    .play-button,
    .restart-button {
      min-height: 48px;
      border-radius: 8px;
      cursor: pointer;
    }

    .play-button {
      border: 1px solid var(--green-dark);
      background: var(--green-dark);
      color: #ffffff;
      font-weight: 900;
    }

    .restart-button {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--green-dark);
      font-size: 22px;
      font-weight: 900;
    }

    .restart-button:hover,
    .play-button:hover {
      filter: brightness(0.97);
    }

    .note {
      margin-top: 14px;
      padding: 12px;
      border-left: 4px solid var(--gold);
      background: #fff9df;
      color: #695b2f;
      font-size: 12px;
      line-height: 1.55;
      font-weight: 750;
    }

    .frames-card {
      grid-column: 1 / -1;
      padding: 15px;
    }

    .frames-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }

    .frames-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .frames {
      display: grid;
      grid-template-columns: repeat(8, minmax(84px, 1fr));
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .frame-button {
      min-width: 84px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
    }

    .frame-button[aria-current="true"] {
      border-color: var(--green-dark);
      background: var(--green-soft);
      box-shadow: inset 0 0 0 1px var(--green-dark);
    }

    .frame-canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .frame-button span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    @media (max-width: 820px) {
      .preview-layout {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 450px;
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: 18px 14px 30px;
      }

      .topbar {
        display: block;
      }

      .source-badge {
        display: inline-block;
        margin-top: 10px;
      }

      .character-switch {
        grid-template-columns: 1fr;
      }

      .character-button {
        min-height: 52px;
      }

      .stage {
        min-height: 390px;
        padding-inline: 10px;
      }

      .stage::after {
        bottom: 62px;
        width: 180px;
      }

      .stage-footer {
        grid-template-columns: 1fr;
      }

      .metric {
        min-height: 58px;
      }

      .mode-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">캐릭터 스프라이트 시트</p>
        <h1 id="pageTitle">거북이 동작 미리보기</h1>
      </div>
      <span class="source-badge" id="sourceBadge">기본 거북이</span>
    </header>

    <nav class="character-switch" aria-label="캐릭터 선택">
      <button class="character-button" type="button" data-character="turtle" aria-pressed="true">
        <strong>거북이</strong><span>4개 동작</span>
      </button>
      <button class="character-button" type="button" data-character="hyunmooTwo" aria-pressed="false">
        <strong>현무 2두</strong><span>9개 동작</span>
      </button>
      <button class="character-button" type="button" data-character="hyunmooThree" aria-pressed="false">
        <strong>현무 3두</strong><span>10개 동작 · 포효 포함</span>
      </button>
    </nav>

    <section class="preview-layout" id="previewLayout" aria-label="거북이 애니메이션 미리보기">
      <article class="stage-card">
        <div class="stage" id="stage">
          <div class="motion-label" id="motionLabel">걷기 재생 중</div>
          <canvas class="sprite-canvas" id="spriteCanvas" width="320" height="320" aria-label="거북이 걷기 애니메이션"></canvas>
        </div>
        <div class="stage-footer">
          <div class="metric"><span>동작</span><strong id="motionMetric">걷기</strong></div>
          <div class="metric"><span>현재 프레임</span><strong id="frameMetric">1 / 8</strong></div>
          <div class="metric"><span>한 사이클</span><strong id="cycleMetric">880ms</strong></div>
        </div>
      </article>

      <aside class="control-card" aria-label="재생 설정">
        <h2>동작 선택</h2>
        <div class="mode-grid" id="modeGrid" role="group" aria-label="거북이 동작"></div>

        <div class="settings">
          <div class="setting-row">
            <div class="setting-head">
              <label for="speed">한 사이클 재생 시간</label>
              <output id="speedValue" for="speed">880ms</output>
            </div>
            <input id="speed" type="range" min="480" max="2400" step="40" value="880">
          </div>
        </div>

        <div class="transport">
          <button class="play-button" id="playButton" type="button">일시정지</button>
          <button class="restart-button" id="restartButton" type="button" aria-label="처음부터 재생" title="처음부터 재생">↺</button>
        </div>

        <p class="note" id="motionNote">짧은 다리의 교차와 몸통 높낮이를 확인할 수 있습니다.</p>
      </aside>

      <section class="frames-card" aria-label="현재 동작의 전체 프레임">
        <div class="frames-head">
          <h2 id="framesTitle">걷기 프레임</h2>
          <span>프레임을 누르면 해당 장면에서 멈춥니다</span>
        </div>
        <div class="frames" id="frames"></div>
      </section>
    </section>
  </main>

  <script src="motion-player.js"></script>
  <script>
    const {
      CHARACTERS,
      availableMotions,
      frameAssetFor,
      frameCountFor,
      motionFor,
      nextFrame,
      sourceRectFor,
    } = window.TurtleMotion;

    const sourceImages = {};
    const frameImages = {};
    const characterButtons = Array.from(document.querySelectorAll(".character-button"));
    const pageTitle = document.getElementById("pageTitle");
    const sourceBadge = document.getElementById("sourceBadge");
    const previewLayout = document.getElementById("previewLayout");
    const stage = document.getElementById("stage");
    const spriteCanvas = document.getElementById("spriteCanvas");
    const modeGrid = document.getElementById("modeGrid");
    const framesRoot = document.getElementById("frames");
    const motionLabel = document.getElementById("motionLabel");
    const motionMetric = document.getElementById("motionMetric");
    const frameMetric = document.getElementById("frameMetric");
    const cycleMetric = document.getElementById("cycleMetric");
    const framesTitle = document.getElementById("framesTitle");
    const motionNote = document.getElementById("motionNote");
    const speed = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");
    const playButton = document.getElementById("playButton");
    const restartButton = document.getElementById("restartButton");

    let characterKey = "turtle";
    let modeKey = "walk";
    let frame = 0;
    let cycleMs = motionFor(characterKey, modeKey).cycleMs;
    let isPlaying = true;
    let lastFrameAt = 0;

    function currentCharacter() {
      return CHARACTERS[characterKey];
    }

    function currentMotion() {
      return motionFor(characterKey, modeKey);
    }

    function currentFrameCount() {
      return frameCountFor(characterKey, modeKey);
    }

    function drawFrameToCanvas(canvas, selectedCharacter, selectedMotion, selectedFrame) {
      const character = CHARACTERS[selectedCharacter];
      const context = canvas.getContext("2d");
      const frameAsset = frameAssetFor(selectedCharacter, selectedMotion, selectedFrame);
      context.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.backgroundColor = canvas.classList.contains("frame-canvas")
        ? character.canvasColor
        : "transparent";
      if (!frameAsset) {
        context.fillStyle = character.canvasColor;
        context.fillRect(0, 0, canvas.width, canvas.height);
      }

      const image = frameAsset ? frameImages[frameAsset] : sourceImages[selectedCharacter];
      if (!image || !image.complete || image.naturalWidth === 0) return;

      const sourceRect = frameAsset
        ? { x: 0, y: 0, width: image.naturalWidth, height: image.naturalHeight }
        : sourceRectFor(selectedCharacter, selectedMotion, selectedFrame);
      const padding = canvas.width * 0.06;
      const scale = Math.min(
        (canvas.width - padding * 2) / sourceRect.width,
        (canvas.height - padding * 2) / sourceRect.height,
      );
      const drawWidth = sourceRect.width * scale;
      const drawHeight = sourceRect.height * scale;
      const drawX = (canvas.width - drawWidth) / 2;
      const drawY = (canvas.height - drawHeight) / 2;

      context.imageSmoothingEnabled = false;
      context.drawImage(
        image,
        sourceRect.x,
        sourceRect.y,
        sourceRect.width,
        sourceRect.height,
        drawX,
        drawY,
        drawWidth,
        drawHeight,
      );
    }

    function renderFrameStrip() {
      framesRoot.innerHTML = "";
      const frameCount = currentFrameCount();
      const motion = currentMotion();

      for (let index = 0; index < frameCount; index += 1) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "frame-button";
        button.setAttribute("aria-current", String(index === frame));
        button.setAttribute("aria-label", `${motion.label} ${index + 1}번 프레임`);

        const canvas = document.createElement("canvas");
        canvas.className = "frame-canvas";
        canvas.width = 128;
        canvas.height = 128;
        drawFrameToCanvas(canvas, characterKey, modeKey, index);

        const label = document.createElement("span");
        label.textContent = `F${index + 1}`;
        button.append(canvas, label);
        button.addEventListener("click", () => {
          frame = index;
          isPlaying = false;
          updateTransport();
          render();
        });
        framesRoot.appendChild(button);
      }
    }

    function updateTransport() {
      playButton.textContent = isPlaying ? "일시정지" : "재생";
      motionLabel.textContent = `${currentMotion().label} ${isPlaying ? "재생 중" : "멈춤"}`;
    }

    function render() {
      const character = currentCharacter();
      const motion = currentMotion();
      const frameCount = currentFrameCount();
      drawFrameToCanvas(spriteCanvas, characterKey, modeKey, frame);
      motionMetric.textContent = motion.label;
      frameMetric.textContent = `${frame + 1} / ${frameCount}`;
      cycleMetric.textContent = `${cycleMs}ms`;
      spriteCanvas.setAttribute("aria-label", `${character.label} ${motion.label} 애니메이션`);
      document.querySelectorAll(".frame-button").forEach((button, index) => {
        button.setAttribute("aria-current", String(index === frame));
      });
      updateTransport();
    }

    function renderMotionButtons() {
      modeGrid.innerHTML = "";
      availableMotions(characterKey).forEach((key) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "mode-button";
        button.dataset.mode = key;
        button.textContent = motionFor(characterKey, key).label;
        button.setAttribute("aria-pressed", String(key === modeKey));
        button.addEventListener("click", () => setMode(key));
        modeGrid.appendChild(button);
      });
    }

    function setMode(nextMode) {
      modeKey = nextMode;
      frame = 0;
      const motion = currentMotion();
      cycleMs = motion.cycleMs;
      isPlaying = true;
      lastFrameAt = performance.now();
      speed.value = String(cycleMs);
      speedValue.textContent = `${cycleMs}ms`;
      framesTitle.textContent = `${motion.label} 프레임`;
      motionNote.textContent = motion.note;
      document.querySelectorAll(".mode-button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.mode === modeKey));
      });
      renderFrameStrip();
      render();
    }

    function setCharacter(nextCharacter) {
      characterKey = nextCharacter;
      const character = currentCharacter();
      modeKey = availableMotions(characterKey)[0];
      pageTitle.textContent = `${character.label} 동작 미리보기`;
      sourceBadge.textContent = character.subtitle;
      previewLayout.setAttribute("aria-label", `${character.label} 애니메이션 미리보기`);
      modeGrid.setAttribute("aria-label", `${character.label} 동작`);
      stage.classList.toggle("dark", character.theme === "dark");
      characterButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.character === characterKey));
      });
      renderMotionButtons();
      setMode(modeKey);
    }

    function animationLoop(now) {
      const frameAsset = frameAssetFor(characterKey, modeKey, frame);
      const image = frameAsset ? frameImages[frameAsset] : sourceImages[characterKey];
      if (image && image.complete && image.naturalWidth > 0 && isPlaying) {
        const frameCount = currentFrameCount();
        const frameMs = cycleMs / frameCount;
        if (now - lastFrameAt >= frameMs) {
          frame = nextFrame(frame, frameCount);
          lastFrameAt = now;
          render();
        }
      }
      requestAnimationFrame(animationLoop);
    }

    characterButtons.forEach((button) => {
      button.addEventListener("click", () => setCharacter(button.dataset.character));
    });

    speed.addEventListener("input", () => {
      cycleMs = Number(speed.value);
      speedValue.textContent = `${cycleMs}ms`;
      render();
    });

    playButton.addEventListener("click", () => {
      isPlaying = !isPlaying;
      lastFrameAt = performance.now();
      updateTransport();
    });

    restartButton.addEventListener("click", () => {
      frame = 0;
      isPlaying = true;
      lastFrameAt = performance.now();
      render();
    });

    Object.entries(CHARACTERS).forEach(([key, character]) => {
      const motionKeys = availableMotions(key);
      const needsSourceSheet = motionKeys.some((motionKey) => (
        frameAssetFor(key, motionKey, 0) === null
      ));
      if (needsSourceSheet) {
        const image = new Image();
        image.addEventListener("load", () => {
          if (key === characterKey) {
            renderFrameStrip();
            render();
          }
        });
        image.addEventListener("error", () => {
          if (key === characterKey) {
            motionLabel.textContent = "스프라이트 이미지를 불러오지 못했습니다";
          }
        });
        image.src = character.sheet;
        sourceImages[key] = image;
      }

      motionKeys.forEach((motionKey) => {
        const frameCount = frameCountFor(key, motionKey);
        for (let index = 0; index < frameCount; index += 1) {
          const path = frameAssetFor(key, motionKey, index);
          if (!path || frameImages[path]) continue;
          const frameImage = new Image();
          frameImage.addEventListener("load", () => {
            if (key === characterKey && motionKey === modeKey) {
              renderFrameStrip();
              render();
            }
          });
          frameImage.src = path;
          frameImages[path] = frameImage;
        }
      });
    });

    setCharacter("turtle");
    requestAnimationFrame(animationLoop);
  </script>
</body>
</html>
